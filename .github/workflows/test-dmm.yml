name: DMM SVOD Crawler

on:
workflow_dispatch:

jobs:
crawl-data:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Fetch Makers
    run: node fetch_makers.js

  - name: Fetch Videos
    run: node fetch_videos.js

  - name: Upload Data Artifacts
    uses: actions/upload-artifact@v4
    with:
      name: dmm-svod-data
      path: |
        makers.json
        videos.txt
      retention-days: 7
