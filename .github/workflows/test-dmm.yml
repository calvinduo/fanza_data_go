name: Test DMM Fetch
on: [push, workflow_dispatch] # 允许手动触发
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # 确保使用 Node.js 18+ 以支持原生 fetch
      - name: Run Fetch Script
        run: node fetch_makers.js
      - name: Check generated file
        run: cat makers.json || echo "File not found"
